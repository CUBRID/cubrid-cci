#
#  The only place the CCI tests know a server from. Every case under testcases\ is
#  handed this file and reads nothing else, so pointing the tests at another server
#  means editing here - no rebuild, no command line arguments.
#
#  Syntax: key = value, one per line. # starts a comment. An empty value is kept as
#  an empty string, which is how a passwordless account is written.
#

host     = test-db-server
port     = 33000
database = demodb
user     = dba
password =

#  ssl_test only. A broker takes either plain or SSL clients, never both, so testing
#  SSL needs a second broker with SSL=ON in cubrid_broker.conf - point ssl_port at it.
#  Leave it out and ssl_test reports SKIPPED instead of failing.
#
#ssl_host = test-db-server   # optional, defaults to host
#ssl_port = 33001
